<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Faiz Aam crest mark: ink rounded square with the lamp flame, open
       book and chinar leaf. Solid silhouettes so the marks stay legible
       at favicon size. Concept artwork — official crest pending
       verification. -->
  <rect width="64" height="64" rx="10" fill="#0b1c2a"/>
  <g fill="#fffdf8">
    <!-- diyā: flame above a cup (core cutout dropped at this scale) -->
    <path d="M 31.9 10.1 C 34.1 13.1 35.3 14.8 35.3 16.6 C 35.3 18.6 33.8 19.8 31.9 19.8 C 30.1 19.8 28.5 18.6 28.5 16.6 C 28.5 14.8 29.7 13.1 31.9 10.1 Z"/>
    <path d="M 26.8 20.3 L 37.1 20.3 L 34.6 22.8 Q 31.9 24.2 29.3 22.8 Z"/>
    <!-- open book: solid page halves with an ink spine rule -->
    <path d="M 31.9 24.6 Q 25.4 23.6 19.4 26.3 L 19.4 36.8 Q 25.4 34 31.9 35.1 Z"/>
    <path d="M 31.9 24.6 Q 38.4 23.6 44.5 26.3 L 44.5 36.8 Q 38.4 34 31.9 35.1 Z"/>
    <path d="M 31.9 24.6 L 31.9 35.1" stroke="#0b1c2a" stroke-width="2.5"/>
  </g>
  <!-- chinar leaf (filled silhouette) -->
  <path fill="#fffdf8" transform="translate(31.9 39.2) scale(0.75) translate(-16 -3)"
    d="M 16 3.0 C 15.4 5.2 14.5 6.4 13.1 8.9 C 12.5 9.6 11.3 9.4 9.5 7.8 C 8.9 7.1 8.4 8.0 10.2 12.6 C 10.4 13.1 7.7 12.9 5.0 14.1 C 4.3 14.6 7.3 15.6 10.6 17.6 C 11.0 18.0 9.9 18.6 8.6 20.6 C 8.2 21.2 10.8 21.6 13.8 22.4 C 14.4 22.5 14.8 22.6 16.0 22.8 C 17.2 22.6 17.6 22.5 18.2 22.4 C 21.2 21.6 23.8 21.2 23.4 20.6 C 22.1 18.6 21.0 18.0 21.4 17.6 C 24.7 15.6 27.7 14.6 27.0 14.1 C 24.3 12.9 21.6 13.1 21.8 12.6 C 23.6 8.0 23.1 7.1 22.5 7.8 C 20.7 9.4 19.5 9.6 18.9 8.9 C 17.5 6.4 16.6 5.2 16.0 3.0 Z"/>
</svg>
